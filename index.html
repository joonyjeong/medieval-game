<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>잔존병</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>잔존병<small>죽은 자는 돌아오지 않는다</small></h1>
  <div class="stat">스테이지 <b id="hStage">1</b></div>
  <div class="stat gold">군자금 <b id="hGold">0</b></div>
  <div class="stat">병력 <b id="hRoster">0</b></div>
  <div class="stat">전사자 <b id="hFallen">0</b></div>
  <div class="stat">최고 기록 <b id="hBest">-</b></div>
</header>

<div class="wrap">
  <main>
    <section class="board" id="prep">
      <div class="field">
        <div>
          <div class="side-label"><span>아군 진형 · 오른쪽이 전열</span><span id="deployCount"></span></div>
          <div class="grid ally" id="allyGrid"></div>
        </div>
        <div class="vs">VS</div>
        <div>
          <div class="side-label"><span>적 진형 · 왼쪽이 전열</span><span id="enemyCount"></span></div>
          <div class="grid enemy" id="enemyGrid"></div>
        </div>
      </div>
      <div class="below">
        <div>
          <div class="side-label"><span>대기 병력 · 끌어서 배치하거나, 눌러서 선택 후 칸을 누르세요</span></div>
          <div class="bench" id="bench"></div>
        </div>
        <div class="orders">
          <button id="btnRecruit">징병</button>
          <button id="btnStart" class="primary">전투 시작</button>
          <div class="hint" id="recruitHint"></div>
        </div>
      </div>
    </section>

    <section class="board" id="battle" hidden>
      <canvas id="cv" width="960" height="480"></canvas>
      <div class="bctrl">
        <span class="hint">배속</span>
        <button data-sp="1" class="on">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button>
        <span class="hint" id="btime"></span>
      </div>
    </section>
  </main>

  <aside>
    <div class="panel" id="detail"><h2>병사 기록부</h2><p class="hint">병사를 눌러 능력치와 전직을 확인하세요.</p></div>
    <div class="panel"><h2>전사자 명부</h2><div class="fallen" id="fallen"><p class="hint">아직 전사자가 없습니다.</p></div></div>
    <div class="panel"><h2>병과</h2><div class="legend" id="legend"></div></div>
  </aside>
</div>

<div class="modal" id="modal" hidden><div class="card" id="mcard"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
